name: iOS build and TestFlight

on:
  push:
    branches: ['ios/**']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml', 'public/js/**', '*Push*.js', 'apns.js', 'push.js']
  workflow_dispatch:
    inputs:
      release:
        description: 'Sign and upload a build to TestFlight'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate icon and project
        working-directory: ios
        run: |
          set -euo pipefail
          swift Tools/generate-icon.swift BananZa/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate
          mkdir -p BananZa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved BananZa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -version
      - name: Build and test on simulator
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild test -project BananZa.xcodeproj -scheme BananZa -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO | tee build/simulator.log
      - name: Capture launch screen
        if: success()
        working-directory: ios
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/BananZa.app
          xcrun simctl launch "$SIMULATOR_ID" app.bananza.ios
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot build/launch.png
      - name: Verify release secrets
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in IOS_TEAM_ID IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISION_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
      - name: Sign archive and upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.release
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: bash Tools/release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bananza-ios-${{ github.run_number }}
          path: |
            ios/build/*.log
            ios/build/*.png
            ios/build/Tests.xcresult
            ios/build/export/*.ipa
            ios/build/DerivedData/Build/Products/Debug-iphonesimulator/BananZa.app
            ios/BananZa/Assets.xcassets/AppIcon.appiconset/AppIcon.png
            ios/BananZa.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          retention-days: 14
