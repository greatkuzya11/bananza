name: BananZa
options:
  bundleIdPrefix: app.bananza
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: ru
  knownRegions: [en, ru]
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.19.0
targets:
  BananZa:
    type: application
    platform: iOS
    sources: [BananZa]
    dependencies:
      - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bananza.ios
        INFOPLIST_FILE: BananZa/Info.plist
        CODE_SIGN_ENTITLEMENTS: BananZa/BananZa.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
  BananZaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BananZaTests]
    dependencies:
      - target: BananZa
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BananZa:
    build:
      targets:
        BananZa: all
    test:
      targets: [BananZaTests]
