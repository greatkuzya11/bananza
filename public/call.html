<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>BananZa Call</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/calls.css">
</head>
<body class="call-external-page">
  <script src="/js/i18n.js"></script>
  <script>
    (function () {
      'use strict';
      var token = decodeURIComponent(String(location.pathname || '').split('/').filter(Boolean).pop() || '');
      window.BananzaExternalCall = { inviteToken: token };
      function parseBody(text) {
        try { return text ? JSON.parse(text) : null; } catch (_) { return text; }
      }
      window.BananzaAppBridge = {
        api: async function (url, opts) {
          opts = opts || {};
          var init = { method: opts.method || 'GET', headers: Object.assign({}, opts.headers || {}) };
          if (opts.body !== undefined) {
            init.headers['Content-Type'] = 'application/json';
            init.body = typeof opts.body === 'string' ? opts.body : JSON.stringify(opts.body || {});
          }
          var res = await fetch(url, init);
          var data = parseBody(await res.text());
          if (!res.ok) {
            var error = new Error((data && (data.error || data.message)) || res.statusText || 'Request failed');
            error.status = res.status;
            error.data = data;
            throw error;
          }
          return data;
        },
        t: function (key, params) {
          return window.BananzaI18n && window.BananzaI18n.t ? window.BananzaI18n.t(key, params) : String(key || '');
        },
        applyLocalizedDom: function (root) {
          if (window.BananzaI18n && window.BananzaI18n.applyTo) window.BananzaI18n.applyTo(root || document);
        },
        getCurrentUser: function () { return null; },
        getCurrentChat: function () { return null; },
        getCurrentChatId: function () { return 0; },
        refreshCallIndicators: function () {},
        syncChatHeaderActions: function () {},
        closeChatHeaderActions: function () {},
        recoverChatViewportLayout: function () {},
      };
    })();
  </script>
  <script src="/js/calls/CallStore.js"></script>
  <script src="/js/calls/CallMedia.js"></script>
  <script src="/js/calls/CallFeature.js"></script>
</body>
</html>
